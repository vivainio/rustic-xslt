[package]
name = "rust-xslt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust XSLT engine, ported from go-xslt (early implementation)"

[dependencies]
roxmltree = "=0.21.1"
quick-xml = "=0.38.4"

bigdecimal = "=0.4.11"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"

typed-arena = "=2.0.2"
unicode-normalization = "=0.1.25"

[dev-dependencies]
serde_json = "=1.0.154"
